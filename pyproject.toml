[project]
name = "sellerlens"
version = "0.1.0"
description = "셀러 리뷰·고객 문의 분석 도우미 (KANT 강의 실습 토이 프로젝트)"
readme = "README.md"
authors = [
    { name = "ho-yu", email = "ttyui0402@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openai>=3.51.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.0.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
# scipy 1.18.x의 컴파일된 DLL(_sobol 등)이 Windows 스마트 앱 컨트롤에 차단된다 (평판 미확보).
# scikit-learn을 통해 들어오는 간접 의존성이라 버전만 제한한다. 차단이 풀리면 지운다.
constraint-dependencies = ["scipy<1.18"]
